# Builds the Windows installer from source, the same steps as the README.
# This is the build SignPath Foundation signs: the signed .exe has to come
# straight from the code in this repo, not from someone's machine.
#
# ponytail: no cache, every run recompiles the three emulators (Azahar is
# most of the ~1 h). Add actions/cache on third_party/*/build-win if it hurts.
name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # So a change to this file tests itself without a manual run.
    branches: [main]
    paths: ['.github/workflows/build-windows.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # The runner ships CMake 4, which refuses cmake_minimum_required < 3.5;
      # mGBA asks for 3.1 and Azahar's nihstro for 2.6. Locally it's CMake 3.28.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vendor:melonds applies patches with `git am`, which wants an identity.
      - run: |
          git config --global user.name "multiemu CI"
          git config --global user.email "ci@users.noreply.github.com"

      # One step per script: a multi-line pwsh step only fails on the last
      # command's exit code, and per-step results show which one broke.
      - run: npm run vendor:mgba
      - run: npm run vendor:melonds
      - run: npm run vendor:azahar

      # Through npm (cmd), never bash: Git Bash turns MSBuild's `/m` into a path.
      - run: npm run build:mgba
      - run: npm run build:melonds
      - run: npm run build:slirp
      - run: npm run build:azahar

      - name: Build addons
        run: npm run build

      # GB, GBA and DS without external ROMs: catches a broken addon before packaging.
      - name: Smoke test
        run: npx electron test/smoke.js
        env:
          ELECTRON_RUN_AS_NODE: '1'

      - name: Build installer
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: multiemu-windows
          path: dist/*.exe
          if-no-files-found: error
