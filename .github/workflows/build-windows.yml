# Builds the Windows installer from source, the same steps as the README.
# This is the build SignPath Foundation signs: the signed .exe has to come
# straight from the code in this repo, not from someone's machine.
#
# ponytail: no cache, every run recompiles the three emulators (Azahar is
# most of the ~1 h). Add actions/cache on third_party/*/build-win if it hurts.
name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Changes to the build itself test themselves without a manual run.
    branches: [main]
    # vendor/multiemu: a submodule bump changes core/gb and the melonDS patch.
    paths: ['.github/workflows/build-windows.yml', 'package.json', 'patches/**', 'vendor/multiemu']

permissions:
  contents: read

jobs:
  build:
    # VS 2022, like the local build. windows-latest has VS 2026 (v18), whose
    # MASM rule fails on Azahar's cryptopp (ml64 can't open
    # cryptopp.dir\Release\src/random/rdrand.asm.obj).
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      # The runner ships CMake 4, which refuses cmake_minimum_required < 3.5;
      # mGBA asks for 3.1 and Azahar's nihstro for 2.6. Locally it's CMake 3.28.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vendor:melonds applies patches with `git am`, which wants an identity.
      - run: |
          git config --global user.name "multiemu CI"
          git config --global user.email "ci@users.noreply.github.com"

      # One step per script: a multi-line pwsh step only fails on the last
      # command's exit code, and per-step results show which one broke.
      - run: npm run vendor:mgba
      - run: npm run vendor:melonds
      - run: npm run vendor:azahar

      # Through npm (cmd), never bash: Git Bash turns MSBuild's `/m` into a path.
      - run: npm run build:mgba
      - run: npm run build:melonds
      - run: npm run build:slirp
      # Compiler errors become annotations, which are public through the API
      # even when the raw log needs a login.
      - name: npm run build:azahar
        run: |
          npm run build:azahar 2>&1 | Tee-Object -FilePath azahar-build.log
          if ($LASTEXITCODE) {
            Select-String -Path azahar-build.log -Pattern ': (fatal )?error |CMake Error' |
              Select-Object -First 25 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Build addons
        run: npm run build

      # GB, GBA and DS without external ROMs: catches a broken addon before packaging.
      - name: Smoke test
        run: npx electron test/smoke.js
        env:
          ELECTRON_RUN_AS_NODE: '1'

      - name: Build installer
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: multiemu-windows
          path: dist/*.exe
          if-no-files-found: error
