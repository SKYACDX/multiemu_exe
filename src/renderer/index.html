<meta charset="utf-8" />
<title>multiemu</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden; /* the canvas fills the window; nothing should scroll */
    background: #101010;
    color: #ddd;
    font: 14px system-ui, sans-serif;
  }
  body { display: grid; place-items: center; }
  /* .panel sets display:flex, which beats the browser's own
     [hidden] { display: none } -- without this every panel shows at once. */
  [hidden] { display: none !important; }
  #screen {
    cursor: crosshair; /* the bottom half is the DS touch screen */
    /* Absolute, not a grid item: inside the grid the row stayed auto-sized,
       so height:100% resolved to auto, the canvas scaled itself by width
       alone, and object-fit had no spare box to letterbox into -- the DS's
       bottom screen just got clipped off. Positioning against the viewport
       gives both axes a definite size. */
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /* canvas is a replaced element, so object-fit letterboxes it at the
       core's own aspect ratio: 160x144 for GB, 240x160 for GBA, and 256x384
       for the DS's two stacked screens. */
    object-fit: contain;
    image-rendering: pixelated;
  }

  .panel {
    width: min(640px, 92vw);
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #picker { text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .muted { color: #8a8a8a; margin: 0; }

  button {
    font: inherit;
    padding: 8px 16px;
    color: #eee;
    background: #2a2a2a;
    border: 1px solid #3d3d3d;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #343434; }
  button.primary { background: #2f6f4f; border-color: #3d8a63; }
  button:disabled { opacity: 0.5; cursor: default; }

  input, select {
    font: inherit;
    padding: 8px 10px;
    color: #eee;
    background: #1b1b1b;
    border: 1px solid #3d3d3d;
    border-radius: 6px;
  }

  .row { display: flex; gap: 8px; align-items: center; }
  .row > input[type="search"],
  .row > input[type="email"],
  .row > input[type="password"],
  .row > input[type="text"] { flex: 1; }

  #results, .saves {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #results li, .saves li {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px;
    background: #1b1b1b;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
  }
  #results img { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; background: #2a2a2a; }
  .title { flex: 1; min-width: 0; }
  .title strong { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title span { color: #8a8a8a; font-size: 12px; }

  #update {
    padding: 10px 12px;
    background: #263a52;
    border: 1px solid #37506e;
    border-radius: 6px;
    text-align: left;
  }
  #update pre { margin: 6px 0 0; white-space: pre-wrap; font: inherit; color: #b9c8da; max-height: 8em; overflow-y: auto; }

  #status { color: #e06c5a; min-height: 1em; margin: 0; }

  /* Shown over the game, where the picker's own status line isn't. */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 8px 16px;
    background: #000000cc;
    border: 1px solid #3d3d3d;
    border-radius: 999px;
    pointer-events: none;
  }
</style>

<div id="picker" class="panel">
  <div id="update" hidden></div>
  <h1>multiemu</h1>
  <p class="muted">Game Boy, Game Boy Color, Game Boy Advance o Nintendo DS</p>
  <div class="row" style="justify-content: center">
    <button id="open" class="primary">Abrir ROM</button>
    <button id="browse">Descargar juegos</button>
    <button id="account-open">Cuenta</button>
  </div>
  <p id="status"></p>
</div>

<div id="browser" class="panel" hidden>
  <div class="row">
    <button class="back">Volver</button>
    <input type="search" id="search" placeholder="Buscar un juego" />
    <select id="platform"><option value="">Todas</option></select>
  </div>
  <p id="browser-status" class="muted"></p>
  <ul id="results"></ul>
</div>

<div id="account" class="panel" hidden>
  <div class="row">
    <button class="back">Volver</button>
    <h1>Cuenta de RomHack Hub</h1>
  </div>
  <form id="login">
    <div class="row"><input type="email" id="email" placeholder="Correo" required /></div>
    <div class="row" style="margin-top: 8px">
      <input type="password" id="password" placeholder="Contraseña" required />
      <button type="submit" class="primary">Entrar</button>
    </div>
  </form>
  <form id="totp" hidden>
    <div class="row">
      <input type="text" id="totp-code" placeholder="Código de dos factores" inputmode="numeric" />
      <button type="submit" class="primary">Verificar</button>
    </div>
  </form>
  <div id="session" hidden>
    <div class="row">
      <p class="muted" id="session-user" style="flex: 1"></p>
      <button id="logout">Salir</button>
    </div>
    <div class="row" style="margin-top: 10px">
      <button id="upload-save">Subir el guardado actual</button>
    </div>
    <ul class="saves" id="cloud-saves" style="margin-top: 10px"></ul>
  </div>
  <p id="account-status" class="muted"></p>
</div>

<canvas id="screen" hidden></canvas>
<div id="toast" hidden></div>

<script src="audio.js"></script>
<script src="hub.js"></script>
<script src="renderer.js"></script>
